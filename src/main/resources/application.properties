spring.application.name=sistema-estoque
server.address=0.0.0.0
server.port=${SERVER_PORT:8081}

# Integracoes / Tokens
classapp.token=${CLASSAPP_TOKEN:token}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Banco de Dados
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sax_bd}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

app.rabbitmq.exchange_name=${EXCHANGE_NAME:exchange_alertas}
app.rabbitmq.queue_name=${QUEUE_NAME:queue_alertas}
app.rabbitmq.routing_key_name=${ROUTING_KEY_NAME:routing_key_alertas}

springdoc.show-actuator=true
